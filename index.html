<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Fantasy Valley POC</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#9fd3ff;font-family:system-ui}canvas{display:block}#hud{position:fixed;top:12px;left:12px;background:#0008;color:#fff;padding:8px 11px;border-radius:10px;font-size:13px;z-index:3}#joy{position:fixed;left:20px;bottom:22px;width:120px;height:120px;border-radius:50%;background:#ffffff33;border:2px solid #ffffff88;z-index:3;touch-action:none}#stick{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:#ffffffaa}#look{position:fixed;right:0;bottom:0;width:50%;height:70%;z-index:2;touch-action:none}@media(pointer:fine){#joy,#look{display:none}}</style></head><body><div id='hud'>Fantasy Valley • WASD / arrows to move • drag mouse to look<br>On phone: left stick moves, drag right side to look</div><div id='joy'><div id='stick'></div></div><div id='look'></div><script type='module'>
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fd3ff);scene.fog=new THREE.Fog(0x9fd3ff,45,130);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff2ff,0x53613a,2));const sun=new THREE.DirectionalLight(0xfff3cf,2.2);sun.position.set(-30,50,20);sun.castShadow=true;scene.add(sun);
function h(x,z){return Math.sin(x*.055)*2.2+Math.cos(z*.045)*1.8+Math.sin((x+z)*.025)*1.4}
const size=140,seg=90,g=new THREE.PlaneGeometry(size,size,seg,seg);g.rotateX(-Math.PI/2);const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,h(x,z))}g.computeVertexNormals();const ground=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x6f9d55,roughness:1}));ground.receiveShadow=true;scene.add(ground);
const water=new THREE.Mesh(new THREE.CircleGeometry(15,48),new THREE.MeshStandardMaterial({color:0x4b9ec4,transparent:true,opacity:.75,roughness:.2}));water.rotation.x=-Math.PI/2;water.position.set(-25,h(-25,-15)+.25,-15);scene.add(water);
function tree(x,z,s=1){const y=h(x,z);const group=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.3*s,.45*s,3*s,7),new THREE.MeshStandardMaterial({color:0x6c4a2e}));trunk.position.y=1.5*s;const crown=new THREE.Mesh(new THREE.ConeGeometry(1.7*s,4.2*s,8),new THREE.MeshStandardMaterial({color:0x315f38}));crown.position.y=4.4*s;group.add(trunk,crown);group.position.set(x,y,z);group.rotation.y=(x*z)%3;scene.add(group)}
for(let i=0;i<75;i++){const a=i*12.9898;const x=((Math.sin(a)*43758.5453)%1)*120-60,z=((Math.sin(a+8.2)*24634.6345)%1)*120-60;if(Math.hypot(x+25,z+15)>20&&Math.hypot(x-15,z-8)>10)tree(x,z,.7+Math.abs(Math.sin(a*2))*.7)}
function house(x,z){const y=h(x,z),q=new THREE.Group(),wall=new THREE.MeshStandardMaterial({color:0xd8c9a8}),roof=new THREE.MeshStandardMaterial({color:0x7b3f2c});const b=new THREE.Mesh(new THREE.BoxGeometry(7,4,6),wall);b.position.y=2;q.add(b);const shape=new THREE.Shape();shape.moveTo(-3.8,0);shape.lineTo(0,2.8);shape.lineTo(3.8,0);shape.closePath();const rg=new THREE.ExtrudeGeometry(shape,{depth:6,bevelEnabled:false});rg.translate(0,0,-3);const r=new THREE.Mesh(rg,roof);r.position.y=4;q.add(r);const door=new THREE.Mesh(new THREE.BoxGeometry(1.3,2.5,.12),new THREE.MeshStandardMaterial({color:0x5e3825}));door.position.set(0,1.25,3.06);q.add(door);q.position.set(x,y,z);q.rotation.y=-.4;scene.add(q)}house(15,8);
const rocksMat=new THREE.MeshStandardMaterial({color:0x77766f,roughness:1});for(let i=0;i<20;i++){const x=-55+i*5.2,z=35+Math.sin(i)*7,r=new THREE.Mesh(new THREE.DodecahedronGeometry(1+Math.abs(Math.sin(i*4))*1.5,0),rocksMat);r.scale.y=.7;r.position.set(x,h(x,z)+.6,z);scene.add(r)}
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,1.1,5,8),new THREE.MeshStandardMaterial({color:0x5b477d}));body.position.y=1.05;player.add(body);player.position.set(0,h(0,18),18);scene.add(player);
let yaw=0,pitch=-.25,keys={},joyX=0,joyY=0;addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);renderer.domElement.addEventListener('pointerdown',()=>{if(matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()});addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-1,Math.min(.5,pitch-e.movementY*.002))}});
const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');function jmove(e){const r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.min(42,Math.hypot(x,y)),a=Math.atan2(y,x);joyX=Math.cos(a)*m/42;joyY=Math.sin(a)*m/42;stick.style.transform=`translate(${joyX*38}px,${joyY*38}px)`}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);jmove(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))jmove(e)});joy.addEventListener('pointerup',()=>{joyX=joyY=0;stick.style.transform=''});
let lx=0,ly=0,looking=false;const look=document.querySelector('#look');look.addEventListener('pointerdown',e=>{looking=true;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)});look.addEventListener('pointermove',e=>{if(!looking)return;yaw-=(e.clientX-lx)*.008;pitch=Math.max(-1,Math.min(.5,pitch-(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});look.addEventListener('pointerup',()=>looking=false);
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(.033,clock.getDelta());let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joyY,r=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX;const l=Math.hypot(f,r);if(l>1){f/=l;r/=l}const speed=7,dx=(Math.sin(yaw)*f+Math.cos(yaw)*r)*speed*dt,dz=(Math.cos(yaw)*f-Math.sin(yaw)*r)*speed*dt;player.position.x+=dx;player.position.z+=dz;player.position.x=Math.max(-67,Math.min(67,player.position.x));player.position.z=Math.max(-67,Math.min(67,player.position.z));player.position.y=h(player.position.x,player.position.z);player.rotation.y=yaw;const dist=7,cp=Math.cos(pitch);camera.position.set(player.position.x-Math.sin(yaw)*cp*dist,player.position.y+3.1+Math.sin(-pitch)*dist*.5,player.position.z-Math.cos(yaw)*cp*dist);camera.lookAt(player.position.x,player.position.y+1.4,player.position.z);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
