<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Universal Maker</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100f;font-family:system-ui,sans-serif;color:#eef7f3}
canvas{display:block}.panel{position:fixed;z-index:10;background:#07100fd9;border:1px solid #ffffff22;backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 10px 40px #0008}
#start{left:14px;top:14px;width:min(430px,calc(100% - 28px));padding:16px;box-sizing:border-box}
h1{font-size:22px;margin:0 0 4px}.sub{opacity:.7;font-size:12px;margin-bottom:12px}
textarea,input{box-sizing:border-box;width:100%;border:1px solid #ffffff25;background:#ffffff0c;color:white;border-radius:10px;padding:11px;margin:5px 0;font:inherit}
textarea{height:100px;resize:vertical}button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;background:#d9f3df;color:#102018;margin-top:7px}
button.secondary{background:#ffffff16;color:white;margin-left:6px}.row{display:flex;gap:6px}.row button{flex:1}
#status{font-size:12px;opacity:.8;margin-top:8px;min-height:18px}
#hud{right:12px;top:12px;padding:9px 12px;font-size:12px;display:none}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.4;pointer-events:none}
#joy{position:fixed;left:22px;bottom:22px;width:110px;height:110px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff25;display:none;z-index:9;touch-action:none}
#knob{position:absolute;width:44px;height:44px;border-radius:50%;background:#ffffff55;left:33px;top:33px}
#look{position:fixed;right:0;bottom:0;width:50%;height:70%;z-index:8;touch-action:none}
.badge{display:inline-block;padding:2px 7px;border-radius:99px;background:#ffffff14;margin-right:4px}
</style>
</head>
<body>
<div id="start" class="panel">
<h1>Universal Maker</h1><div class="sub">Describe a world. AI plans it; Universal Maker builds and remembers it.</div>
<input id="key" type="password" autocomplete="off" placeholder="OpenAI API key (stored only in this browser)">
<textarea id="prompt" placeholder="e.g. A misty alpine valley with pine forests, a cold lake, stone cottages, ruins and distant snowy mountains."></textarea>
<div class="row"><button id="make">Make / remake world</button><button id="hide" class="secondary">Explore</button></div>
<div class="row"><button id="forget" class="secondary">Forget API key</button><button id="clear" class="secondary">Clear saved world</button></div>
<div id="status">Loading saved world…</div>
</div>
<div id="hud" class="panel"><span class="badge">WASD / arrows</span><span class="badge">drag to look</span><span id="chunk"></span></div>
<div id="cross">＋</div><div id="joy"><div id="knob"></div></div><div id="look"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const $=s=>document.querySelector(s), status=$('#status'), keyEl=$('#key'), promptEl=$('#prompt');
const DB='universal-maker-v2', STORE='kv';
function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function get(k){let d=await db();return new Promise((ok,no)=>{let r=d.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function put(k,v){let d=await db();return new Promise((ok,no)=>{let r=d.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
async function del(k){let d=await db();return new Promise((ok,no)=>{let r=d.transaction(STORE,'readwrite').objectStore(STORE).delete(k);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}

let scene,camera,renderer,player,worldGroup,clock=new THREE.Clock(), yaw=0,pitch=.28, keys={}, spec, seed=12345;
const chunks=new Map(), CHUNK=80, RADIUS=2, assetRecipes=new Map();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(n){let x=(n>>>0)||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
function height(x,z){let s=seed*.001;return Math.sin(x*.018+s)*5+Math.cos(z*.021-s)*4+Math.sin((x+z)*.009)*6+(spec?.relief||1)*Math.sin(x*.004)*9}
function defaultSpec(p=''){return {name:'Generated World',seed:hash(p||'world'),sky:'#91b8bd',fog:'#a6bdba',fogNear:45,fogFar:170,ground:'#526e43',water:'#547d87',relief:1.1,waterLevel:-5,treeDensity:.045,rockDensity:.010,buildingDensity:.0015,tree:{id:'pine-temperate-v1',kind:'pine',trunk:'#5a4332',foliage:'#244b35',height:8,crown:2.8},building:{id:'stone-cottage-v1',wall:'#77736a',roof:'#403b38'},mood:'misty'}}

function init(){
 scene=new THREE.Scene(); camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xddeeff,0x273225,1.6));let sun=new THREE.DirectionalLight(0xfff2d0,2.5);sun.position.set(-45,75,35);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;scene.add(sun);
 player=new THREE.Object3D();scene.add(player); worldGroup=new THREE.Group();scene.add(worldGroup);
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
 let dragging=false,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(!dragging)return;yaw-=(e.clientX-lx)*.004;pitch=clamp(pitch+(e.clientY-ly)*.003,-.2,1.0);lx=e.clientX;ly=e.clientY});
 setupTouch();animate();
}
let joy={x:0,y:0};function setupTouch(){if(!matchMedia('(pointer:coarse)').matches)return;$('#joy').style.display='block';let j=$('#joy'),k=$('#knob');function mv(e){let r=j.getBoundingClientRect(),t=e.touches[0],x=t.clientX-(r.left+r.width/2),y=t.clientY-(r.top+r.height/2),m=Math.hypot(x,y)||1,q=Math.min(40,m)/m;joy={x:x*q/40,y:y*q/40};k.style.transform=`translate(${x*q}px,${y*q}px)`}j.addEventListener('touchstart',mv);j.addEventListener('touchmove',mv);j.addEventListener('touchend',()=>{joy={x:0,y:0};k.style.transform=''}) ;let look=$('#look'),last=null;look.addEventListener('touchstart',e=>last=e.touches[0]);look.addEventListener('touchmove',e=>{let t=e.touches[0];if(last){yaw-=(t.clientX-last.clientX)*.006;pitch=clamp(pitch+(t.clientY-last.clientY)*.004,-.2,1)}last=t});look.addEventListener('touchend',()=>last=null)}

function mat(c,rough=.9){return new THREE.MeshStandardMaterial({color:c,roughness:rough})}
function makeTree(recipe){let g=new THREE.Group(),h=recipe.height||8;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.28,.42,h*.58,7),mat(recipe.trunk||'#5a4332'));trunk.position.y=h*.29;trunk.castShadow=true;g.add(trunk);let fm=mat(recipe.foliage||'#254d36',.95);for(let i=0;i<3;i++){let crown=new THREE.Mesh(new THREE.ConeGeometry((recipe.crown||2.8)*(1-i*.17),h*.42,8),fm);crown.position.y=h*.52+i*h*.16;crown.castShadow=true;g.add(crown)}return g}
function makeRock(r){let m=new THREE.Mesh(new THREE.IcosahedronGeometry(.8+r()*1.3,1),mat('#666b62'));m.scale.set(1+r(),.5+r()*.8,.8+r());m.castShadow=true;return m}
function makeBuilding(recipe){let g=new THREE.Group(),wall=mat(recipe.wall||'#77736a'),roof=mat(recipe.roof||'#403b38');let b=new THREE.Mesh(new THREE.BoxGeometry(7,4.3,5.5),wall);b.position.y=2.15;b.castShadow=true;g.add(b);let rr=new THREE.Mesh(new THREE.ConeGeometry(5.2,3.1,4),roof);rr.rotation.y=Math.PI/4;rr.position.y=5.55;rr.scale.z=.78;rr.castShadow=true;g.add(rr);return g}
function ensureRecipe(r){if(!r?.id)return;r=structuredClone(r);if(!assetRecipes.has(r.id)){assetRecipes.set(r.id,r);put('asset:'+r.id,r)}}
async function loadRecipes(){let d=await db();return new Promise(ok=>{let tx=d.transaction(STORE),req=tx.objectStore(STORE).openCursor(),a=[];req.onsuccess=e=>{let c=e.target.result;if(c){if(String(c.key).startsWith('asset:')){assetRecipes.set(c.value.id,c.value);a.push(c.value.id)}c.continue()}else ok(a)}})}

function buildChunk(cx,cz){
 let id=cx+','+cz;if(chunks.has(id))return;let r=rng(hash(id+'|'+seed)),group=new THREE.Group(),N=18,geom=new THREE.PlaneGeometry(CHUNK,CHUNK,N,N);geom.rotateX(-Math.PI/2);let pos=geom.attributes.position;
 for(let i=0;i<pos.count;i++){let x=pos.getX(i)+cx*CHUNK,z=pos.getZ(i)+cz*CHUNK;pos.setY(i,height(x,z))}
 geom.computeVertexNormals();let terrain=new THREE.Mesh(geom,mat(spec.ground||'#526e43'));terrain.receiveShadow=true;terrain.position.set(cx*CHUNK,0,cz*CHUNK);group.add(terrain);
 let area=CHUNK*CHUNK, tc=Math.min(95,Math.round(area*(spec.treeDensity||.03))),rc=Math.min(28,Math.round(area*(spec.rockDensity||.006))),bc=Math.min(4,Math.round(area*(spec.buildingDensity||.0004)));
 let tr=assetRecipes.get(spec.tree?.id)||spec.tree;for(let i=0;i<tc;i++){let x=(cx+(r()-.5))*CHUNK,z=(cz+(r()-.5))*CHUNK,y=height(x,z);if(y<(spec.waterLevel||-99)+1)continue;let o=makeTree(tr);o.position.set(x,y,z);let s=.7+r()*.7;o.scale.setScalar(s);o.rotation.y=r()*6.28;group.add(o)}
 for(let i=0;i<rc;i++){let x=(cx+(r()-.5))*CHUNK,z=(cz+(r()-.5))*CHUNK,o=makeRock(r);o.position.set(x,height(x,z),z);o.rotation.set(r(),r()*6.28,r());group.add(o)}
 for(let i=0;i<bc;i++){let x=(cx+(r()-.5))*CHUNK,z=(cz+(r()-.5))*CHUNK,o=makeBuilding(spec.building);o.position.set(x,height(x,z),z);o.rotation.y=Math.floor(r()*4)*Math.PI/2;group.add(o)}
 worldGroup.add(group);chunks.set(id,group);
}
function stream(){let cx=Math.round(player.position.x/CHUNK),cz=Math.round(player.position.z/CHUNK);for(let x=cx-RADIUS;x<=cx+RADIUS;x++)for(let z=cz-RADIUS;z<=cz+RADIUS;z++)buildChunk(x,z);for(let [id,g] of chunks){let [x,z]=id.split(',').map(Number);if(Math.abs(x-cx)>RADIUS+1||Math.abs(z-cz)>RADIUS+1){worldGroup.remove(g);chunks.delete(id)}}$('#chunk').textContent=` chunk ${cx},${cz} · ${chunks.size} loaded`}

function applyWorld(s){
 spec={...defaultSpec(promptEl.value),...s};seed=Number(spec.seed)||hash(JSON.stringify(spec));ensureRecipe(spec.tree);ensureRecipe(spec.building);
 scene.background=new THREE.Color(spec.sky);scene.fog=new THREE.Fog(spec.fog||spec.sky,spec.fogNear||45,spec.fogFar||170);
 for(let [,g] of chunks)worldGroup.remove(g);chunks.clear();
 let old=worldGroup.getObjectByName('water');if(old)worldGroup.remove(old);let w=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshPhysicalMaterial({color:spec.water||'#547d87',roughness:.2,metalness:0,transparent:true,opacity:.72}));w.rotation.x=-Math.PI/2;w.position.y=spec.waterLevel??-5;w.name='water';worldGroup.add(w);
 player.position.set(0,height(0,0)+1.6,0);stream();$('#hud').style.display='block';
}
function animate(){requestAnimationFrame(animate);let dt=Math.min(.035,clock.getDelta());if(player&&spec){let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y,r=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x,sp=(keys.ShiftLeft?12:7)*dt;player.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*r)*sp;player.position.z+=(Math.cos(yaw)*f-Math.sin(yaw)*r)*sp;player.position.y=height(player.position.x,player.position.z)+1.6;let dist=8,cy=player.position.y+2;camera.position.set(player.position.x-Math.sin(yaw)*dist,cy+Math.sin(pitch)*5,player.position.z-Math.cos(yaw)*dist);camera.lookAt(player.position.x,player.position.y+1,player.position.z);stream()}renderer.render(scene,camera)}

function extractText(j){if(j.output_text)return j.output_text;let a=[];for(let o of j.output||[])for(let c of o.content||[])if(c.type==='output_text'&&c.text)a.push(c.text);return a.join('\n')}
async function aiPlan(prompt,key){
 let existing=[...assetRecipes.values()].slice(0,30);
 let instructions=`You are the world planner for Universal Maker, a walkable 3D world generator. Return ONLY valid JSON, no markdown. Design a visually coherent world from the user's prompt. Reuse an existing asset recipe if it fits; otherwise create a new recipe with a stable descriptive id. Keep densities mobile-friendly. JSON keys: name, seed(integer), sky(hex), fog(hex), fogNear(35-80), fogFar(110-220), ground(hex), water(hex), waterLevel(-12 to 2), relief(0.3-2), treeDensity(0-0.012), rockDensity(0-0.004), buildingDensity(0-0.0005), mood, tree:{id,kind,trunk,foliage,height(4-16),crown(1.5-5)}, building:{id,wall,roof}. Existing reusable recipes: ${JSON.stringify(existing)}. The engine currently synthesizes procedural geometry from these recipes; make the recipes fit the requested world.`;
 let res=await fetch('https://api.openai.com/v1/responses',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'gpt-5.6-luna',store:false,reasoning:{effort:'low'},instructions,input:prompt,max_output_tokens:1800})});
 let j=await res.json();if(!res.ok)throw Error(j.error?.message||`API ${res.status}`);let t=extractText(j).trim().replace(/^```json\s*|```$/g,'');return JSON.parse(t)
}

$('#make').onclick=async()=>{let p=promptEl.value.trim(),k=keyEl.value.trim();if(!p)return status.textContent='Describe the world first.';if(k)await put('apiKey',k);await put('prompt',p);status.textContent='Planning world… existing assets will be reused where suitable.';let s;try{if(!k)throw Error('No API key entered');s=await aiPlan(p,k);status.textContent='AI plan received. Building nearby chunks…'}catch(e){s=defaultSpec(p);s.seed=hash(p);status.textContent='AI planning unavailable ('+e.message+'). Built a local fallback world instead.'}applyWorld(s);await put('worldSpec',s);await put('worldPrompt',p);setTimeout(()=>{$('#start').style.display='none'},800)};
$('#hide').onclick=()=>$('#start').style.display='none';
$('#forget').onclick=async()=>{await del('apiKey');keyEl.value='';status.textContent='Saved API key removed from this browser.'};
$('#clear').onclick=async()=>{await del('worldSpec');await del('worldPrompt');promptEl.value='';status.textContent='Saved world removed. Shared asset recipes were kept for reuse.'};

init();
(async()=>{await loadRecipes();let k=await get('apiKey'),p=await get('worldPrompt')||await get('prompt'),s=await get('worldSpec');if(k)keyEl.value=k;if(p)promptEl.value=p;if(s){applyWorld(s);status.textContent=`Restored "${s.name||'saved world'}". ${assetRecipes.size} reusable asset recipe(s) cached.`}else status.textContent=`Ready. ${assetRecipes.size} reusable asset recipe(s) cached.`})().catch(e=>status.textContent='Ready.');
</script></body></html>
